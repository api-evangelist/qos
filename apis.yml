name: QoS
description: >-
  Quality of Service (QoS) is the description or measurement of overall performance
  of a service, particularly in computer networking and telecommunications. QoS
  encompasses traffic prioritization, packet loss management, latency control, and
  bandwidth allocation to ensure reliable performance for applications such as VoIP,
  video streaming, and real-time systems.
